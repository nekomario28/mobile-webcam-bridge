# The kernel UAPI spells these this way (`VIDIOC_S_PARM`, `stride/parm`), NSIS has
# `StrCpy`, and one test deliberately feeds a misspelled flag to prove the parser
# names it.
[default.extend-words]
PARM = "PARM"
parm = "parm"
StrCpy = "StrCpy"
Cpy = "Cpy"
identiy = "identiy"
# The release keystore's certificate digest begins BA:..., and typos reads the leading pair as a word.
# Written in upper case here because that is how keytool and apksigner print a digest.
BA = "BA"

[files]
extend-exclude = [
  "target/",
  "android/.gradle/",
  "android/app/build/",
  "host-rs/target/",
]
