name: Xperia hardware gates

on:
  workflow_dispatch:
    inputs:
      action:
        description: Hardware action to run on the locally attached Xperia
        required: true
        type: choice
        options:
          - enumerate
          - g0-switch
          - g0.5-smoke
        default: enumerate
      smoke_iterations:
        description: G0.5 PING/PONG count
        required: false
        default: '1000'

permissions:
  contents: read

concurrency:
  group: mobile-webcam-hardware
  cancel-in-progress: false

jobs:
  xperia:
    runs-on: [self-hosted, Linux, X64, mobile-webcam]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Assert exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      # The classic C++ probe tools (host/) were removed; these gates use the Rust host.
      # The old g1-dump action needed the classic amb-video-dump, which cannot pass
      # per-PC authorization against a v0.3.x phone; G1 is exercised by the app itself.
      - name: Build Rust host tools against real libusb
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          command -v cargo
          command -v lsusb
          command -v python3
          pkg-config --exists libusb-1.0
          cargo build --manifest-path host-rs/Cargo.toml --release --locked \
            --no-default-features --bin mobile-webcam-usb
          if [[ "$ACTION" == g0.5-smoke ]]; then
            # --usb-probe lives in the full host binary (needs the FFmpeg headers).
            cargo build --manifest-path host-rs/Cargo.toml --release --locked --bin mobile-webcam
          fi

      - name: USB policy preflight
        shell: bash
        run: |
          set -euo pipefail
          echo '--- lsusb ---'
          lsusb
          if lsusb | awk '{print tolower($6)}' | grep -qx '18d1:2d01'; then
            echo 'FAIL: AOA+ADB PID 18d1:2d01 is present. This project requires USB debugging OFF.'
            exit 23
          fi
          echo 'usb_debugging_policy=PASS(no 18d1:2d01 observed)'

      - name: Enumerate with the Rust USB helper
        if: inputs.action == 'enumerate'
        shell: bash
        run: |
          set -euo pipefail
          usb="host-rs/target/release/mobile-webcam-usb"
          if "$usb" --list; then
            exit 0
          fi
          sudo -n "$usb" --list

      - name: G0 switch to accessory-only AOA
        if: inputs.action == 'g0-switch'
        shell: bash
        run: |
          set -euo pipefail
          usb="host-rs/target/release/mobile-webcam-usb"
          if lsusb | awk '{print tolower($6)}' | grep -qx '18d1:2d00'; then
            echo '[PASS G0 HOST] already in accessory-only AOA: 18d1:2d00'
            exit 0
          fi

          listing="$("$usb" --list 2>/dev/null || sudo -n "$usb" --list)"
          # Exactly one Sony (0fce) candidate, or refuse to send any vendor request.
          selected="$(printf '%s\n' "$listing" | python3 -c '
          import json, sys
          found = [c["id"] for c in json.loads(sys.stdin.read()) if c["id"]["vid"] == 0x0FCE]
          if len(found) != 1:
              sys.exit(f"Expected exactly one pre-AOA Sony device; found {len(found)}. Refusing mutation.")
          print(json.dumps(found[0]))
          ')" || exit 22
          echo "xperia_candidate=$selected"

          if ! printf '%s\n' "$selected" | "$usb" --switch; then
            # As root the helper insists on a parent whose exit ends it.
            printf '%s\n' "$selected" | sudo -n "$usb" --switch --parent "$$"
          fi

          found=''
          for _ in {1..40}; do
            sleep 0.25
            found="$(lsusb | awk '{id=tolower($6); if (id=="18d1:2d00" || id=="18d1:2d01") print id}' | head -n1)"
            [[ -n "$found" ]] && break
          done
          lsusb
          if [[ "$found" == '18d1:2d00' ]]; then
            echo '[PASS G0 HOST] 18d1:2d00'
          elif [[ "$found" == '18d1:2d01' ]]; then
            echo '[FAIL G0 POLICY] AOA+ADB appeared'
            exit 23
          else
            echo '[FAIL G0 HOST] no AOA re-enumeration observed'
            exit 24
          fi

      - name: G0.5 framed bulk smoke test
        if: inputs.action == 'g0.5-smoke'
        shell: bash
        env:
          ITERATIONS: ${{ inputs.smoke_iterations }}
        run: |
          set -euo pipefail
          [[ "$ITERATIONS" =~ ^[1-9][0-9]{0,5}$ ]] || { echo 'invalid smoke_iterations'; exit 2; }
          # The probe performs the AOA transition and the per-PC authorization itself;
          # approve this PC on the phone when it asks.
          host="host-rs/target/release/mobile-webcam"
          if "$host" --usb-probe --frames "$ITERATIONS"; then
            exit 0
          fi
          sudo -n "$host" --usb-probe --frames "$ITERATIONS"
