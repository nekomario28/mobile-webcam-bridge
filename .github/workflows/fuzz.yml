name: fuzz

# Full coverage fuzzing runs weekly; relevant PRs run a short decoder smoke.
# The stable property tests in host-rs/tests/parsers.rs guard other PRs.
on:
  pull_request:
    paths:
      - '.github/workflows/fuzz.yml'
      - 'host-rs/fuzz/**'
      - 'host-rs/src/video_config.rs'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The decoder-only build needs USB headers, not the GUI, Wayland or FFmpeg.
      - name: Native dependencies for USB decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libusb-1.0-0-dev
      - name: Install nightly and cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz
      - name: Fuzz every decoder reachable from the network
        working-directory: host-rs
        run: |
          set -euo pipefail
          seconds=300
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            seconds=15
          fi
          cargo +nightly fuzz run wire_decode -- "-max_total_time=$seconds" -print_final_stats=1
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: host-rs/fuzz/artifacts
