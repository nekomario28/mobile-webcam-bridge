name: fuzz

# Full coverage fuzzing runs weekly; relevant PRs run a short decoder smoke.
# The stable property tests in host-rs/tests/parsers.rs guard other PRs.
on:
  pull_request:
    paths:
      - '.github/workflows/fuzz.yml'
      - 'host-rs/fuzz/**'
      - 'host-rs/src/fuzzing.rs'
      - 'host-rs/src/transport/framing.rs'
      - 'host-rs/src/video_config.rs'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # wire_decode: every payload decoder. frame_stream: the AMB1 reassembly USB
        # and TCP share, in arbitrary chunks. control_lines: JSON between the GUI, the
        # worker and the privileged USB helper. settings_file: the Linux INI loader.
        target: [wire_decode, frame_stream, control_lines, settings_file]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The decoder-only build needs USB headers, not the GUI, Wayland or FFmpeg.
      - name: Native dependencies for USB decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libusb-1.0-0-dev
      - name: Install nightly and cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        working-directory: host-rs
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          seconds=300
          if [ "$EVENT" = "pull_request" ]; then
            seconds=15
          fi
          cargo +nightly fuzz run "$TARGET" -- "-max_total_time=$seconds" -print_final_stats=1
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: host-rs/fuzz/artifacts
