name: secure-wifi-android-emulator
on:
  pull_request:
    paths:
      - 'android/**'
      - 'protocol/fixtures/client-signature*'
      - 'protocol/fixtures/client-auth*'
      - '.github/workflows/secure-wifi-android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-wifi-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keystore-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind clean source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p build/secure-wifi
          git rev-parse HEAD > build/secure-wifi/source-head.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The wrapper is the single owner of the Gradle version: AGP 9 needs
          # 9.6+, and pinning a version here meant a wrapper bump changed
          # nothing in CI (measured 2026-10-26: AGP 9.4.1 refused to apply
          # with "Minimum supported Gradle version is 9.6.0. Current version
          # is 8.9" while the wrapper already said 9.8.1).
          gradle-version: wrapper
      - name: Build Android app and instrumented smoke test
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > ../build/secure-wifi/apk-sha256.txt
      - name: Verify Android Keystore and TLS 1.3 on API 35 emulator
        id: conformance
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/secure-wifi-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n secure-wifi -k "system-images;android-35;google_apis;x86_64" --device pixel
          sudo chmod a+rw /dev/kvm
          mkdir -p build/secure-wifi
          # Collect the Android-side failure even when the external TLS client
          # aborts before the instrumentation process returns.
          dump_android_failure() {
            local result="$1"
            if [ "$result" -ne 0 ]; then
              echo "--- Android instrumentation ---"
              if [ -n "${instrument_pid:-}" ]; then
                # Give the Android-side instrumentation bounded time to write
                # its own failure/exception after the client disconnects.
                for _ in $(seq 1 20); do
                  if ! kill -0 "$instrument_pid" 2>/dev/null; then break; fi
                  sleep 1
                done
              fi
              cat build/secure-wifi/instrumentation.log 2>/dev/null || true
              echo "--- TLS app/platform logcat ---"
              timeout 10 adb logcat -d SecureWifiGate:I Conscrypt:V AndroidKeyStore:V AndroidRuntime:E '*:S' 2>/dev/null | tail -130 || true
            fi
          }
          "$ANDROID_HOME/emulator/emulator" -avd secure-wifi -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back emulated -memory 2048 -cores 2 > build/secure-wifi/emulator.log 2>&1 &
          emulator_pid=$!
          # A second EXIT trap previously replaced dump_android_failure,
          # hiding the Android-side exception behind OpenSSL EOF.
          on_exit() {
            local result=$?
            dump_android_failure "$result"
            # Pull while the emulator is still alive; the next workflow step
            # must not try to read a device this EXIT trap already stopped.
            timeout 10 adb logcat -d -t 500 > build/secure-wifi/logcat.txt 2>&1 || true
            if ! timeout 30 adb pull /sdcard/Android/data/dev.nekomario.amb/files/authorization-ui build/secure-wifi/authorization-ui; then
              echo "Authorization UI artifact pull failed" >&2
            fi
            # Camera acceptance JSON, pulled while the device still exists; the
            # pull legitimately fails when the run skipped for lack of a camera.
            if ! timeout 30 adb pull /sdcard/Android/data/dev.nekomario.amb/files/camera-acceptance build/secure-wifi/camera-acceptance; then
              echo "camera acceptance artifact not collected (absent when the run skipped)" >&2
            fi
            kill "$emulator_pid" 2>/dev/null || true
            trap - EXIT
            exit "$result"
          }
          trap on_exit EXIT
          boot_completed() { [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; }
          export -f boot_completed
          timeout 180 bash -c 'until boot_completed; do sleep 2; done'
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # ADB forwards the Linux runner's TCP connection to the emulator's
          # real Android SSLServerSocket; this does not exercise another
          # Android Conscrypt client inside the same instrumentation process.
          # This freshly created AVD has no user state. Keep the actual pointer
          # scenarios awake through the real 30-second approval cooldowns.
          adb shell settings put system screen_off_timeout 600000
          adb shell input keyevent 82
          adb logcat -c
          adb forward tcp:48527 tcp:48527
          adb shell am instrument -w -e disposableUi true dev.nekomario.amb.test/dev.nekomario.amb.UsbPermissionInstrumentation > build/secure-wifi/instrumentation.log 2>&1 &
          instrument_pid=$!
          phone_pin=""
          phone_key=""
          for _ in $(seq 1 45); do
            ready_line="$(adb logcat -d -s SecureWifiGate:I 2>/dev/null | grep -oE 'READY SHA256=[A-F0-9]{64} KEY=[0-9a-fA-F]{32}' | tail -1 || true)"
            if [ -n "$ready_line" ]; then
              phone_pin="${ready_line##*SHA256=}"
              phone_pin="${phone_pin%% KEY=*}"
              phone_key="${ready_line##*KEY=}"
              break
            fi
            if ! kill -0 "$instrument_pid" 2>/dev/null; then
              cat build/secure-wifi/instrumentation.log
              echo "Instrumentation exited before starting the TLS listener" >&2
              exit 1
            fi
            sleep 1
          done
          test -n "$phone_pin"
          test -n "$phone_key"
          export PHONE_SHA256="$phone_pin"
          export PHONE_KEY="$phone_key"
          python3 - <<'PY_TLS'
          import hashlib, os, socket, ssl, struct, subprocess, tempfile, time
          context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE  # TEST CLIENT ONLY: pin is checked explicitly below
          context.minimum_version = ssl.TLSVersion.TLSv1_3
          context.maximum_version = ssl.TLSVersion.TLSv1_3
          context.options |= ssl.OP_NO_TICKET  # no session resumption: every gate connection pays a full handshake
          def receive_exact(connection, count):
              output = bytearray()
              while len(output) < count:
                  chunk = connection.recv(count - len(output))
                  if not chunk:
                      raise RuntimeError("TLS peer closed before sending authenticated ACK")
                  output.extend(chunk)
              return bytes(output)
          def tls_hello(label, key_hex, expect_ack):
              started = time.monotonic()
              with socket.create_connection(("127.0.0.1", 48527), timeout=6) as raw:
                  connected = time.monotonic()
                  with context.wrap_socket(raw, server_hostname="mobile-webcam.local") as connection:
                      handshaked = time.monotonic()
                      connection.settimeout(6)
                      print(f"{label}: tcp={connected-started:.2f}s handshake={handshaked-connected:.2f}s")
                      assert connection.version() == "TLSv1.3", connection.version()
                      actual = hashlib.sha256(connection.getpeercert(binary_form=True)).hexdigest().upper()
                      assert actual == os.environ["PHONE_SHA256"], "Android certificate does not match screen fingerprint"
                      header = struct.pack("<4sBBHIIQ", b"AMB1", 1, 1, 0, 1, 16, 0)
                      assert len(header) == 24
                      connection.sendall(header + bytes.fromhex(key_hex))
                      sent = time.monotonic()
                      if expect_ack:
                          magic, version, kind, flags, sequence, length, timestamp = struct.unpack(
                              "<4sBBHIIQ", receive_exact(connection, 24))
                          assert (magic, version, kind, flags, sequence, length, timestamp) == (
                              b"AMB1", 1, 2, 0, 1, 0, 0)
                          print(f"{label}: ack={time.monotonic()-sent:.2f}s total={time.monotonic()-started:.2f}s")
                          # Quality control inside this same TLS session. The
                          # server accepts one active client, so the prepare
                          # cannot use a second connection. The emulator holds
                          # no camera grant, so the answer must be a typed
                          # permission rejection, not a dropped connection.
                          def frame():
                              header = receive_exact(connection, 24)
                              values = struct.unpack("<4sBBHIIQ", header)
                              assert values[:2] == (b"AMB1", 1), header
                              payload = receive_exact(connection, values[5]) if values[5] else b""
                              return values[2], payload
                          def wait_for_kind(kind, what):
                              deadline = time.monotonic() + 6
                              while True:
                                  seen, payload = frame()
                                  if seen == kind:
                                      return payload
                                  assert time.monotonic() < deadline, \
                                      f"{what}: never arrived, last type {seen}"
                          kind, challenge = frame()
                          assert kind == 0x0a and len(challenge) == 66 and challenge[:2] == bytes([2, 1]), (kind, challenge)
                          binding = bytes.fromhex(os.environ["PHONE_SHA256"])
                          assert challenge[2:34] == binding, "challenge is for a different phone certificate"
                          # Independent OpenSSL PC key and v2 transcript. This
                          # ephemeral private key never enters uploaded artifacts.
                          with tempfile.TemporaryDirectory(prefix="amb-proof-") as directory:
                              key = os.path.join(directory, "client.pem")
                              subprocess.run(["openssl", "genpkey", "-algorithm", "EC", "-pkeyopt", "ec_paramgen_curve:P-256", "-out", key], check=True, capture_output=True)
                              public = subprocess.check_output(["openssl", "pkey", "-in", key, "-pubout", "-outform", "DER"])[-65:]
                              assert len(public) == 65 and public[0] == 4
                              label_bytes = b"ci-openssl-pc"
                              transcript = b"AMB1 PC authorization\x00v2\x00" + bytes([1]) + binding + challenge[34:] + public + bytes([len(label_bytes)]) + label_bytes
                              der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", key], input=transcript, check=True, capture_output=True).stdout
                              assert der[0] == 0x30 and der[1] == len(der) - 2
                              offset = 2
                              raw_signature = b""
                              for _ in range(2):
                                  assert der[offset] == 2
                                  size = der[offset + 1]
                                  integer = int.from_bytes(der[offset + 2:offset + 2 + size], "big")
                                  raw_signature += integer.to_bytes(32, "big")
                                  offset += 2 + size
                              assert offset == len(der)
                              proof = bytes([2]) + public + bytes([len(label_bytes)]) + label_bytes + raw_signature
                              connection.sendall(struct.pack("<4sBBHIIQ", b"AMB1", 1, 0x0b, 0, 2, len(proof), 0) + proof)
                          kind, outcome = frame()
                          assert kind == 0x0c and struct.unpack("<BBI", outcome) == (1, 0, 0), (kind, outcome)
                          kind, outcome = frame()
                          status, reason, expiry = struct.unpack("<BBI", outcome)
                          assert kind == 0x0c and status == 0 and reason == 0 and expiry > int(time.time()), (kind, outcome)
                          print("authorization: signed v2 enrollment, pending then explicit phone-fixture approval")
                          capabilities = wait_for_kind(0x05, "quality capabilities")
                          # u8 version, u8 permission, u16 revision,
                          # u32 epoch, u16 mode count, then 12-byte modes.
                          assert capabilities[0] == 1, capabilities[0]
                          assert capabilities[1] == 1, capabilities[1]
                          assert struct.unpack("<H", capabilities[2:4])[0] == 7, capabilities[2:4]
                          assert struct.unpack("<H", capabilities[8:10])[0] == 1, capabilities[8:10]
                          width, height, fps, _reserved, bitrate = struct.unpack(
                              "<HHHHI", capabilities[10:22])
                          assert (width, height, fps, bitrate) == (1280, 720, 30, 6000000), \
                              (width, height, fps, bitrate)
                          connection.sendall(
                              struct.pack("<4sBBHIIQ", b"AMB1", 1, 0x06, 0, 2, 14, 0) +
                              struct.pack("<IHHHHH", 1, 7, 1280, 720, 30, 0))
                          result = wait_for_kind(0x07, "quality result")
                          request_id, status, reason = struct.unpack("<IBB", result[:6])
                          assert (request_id, status, reason) == (1, 1, 1), \
                              (request_id, status, reason)
                          connection.sendall(
                              struct.pack("<4sBBHIIQ", b"AMB1", 1, 0x03, 0, 3, 8, 0) + bytes(8))
                          assert wait_for_kind(0x04, "pong") == bytes(8)
                          print("quality: capabilities, typed rejection and pong")
                      else:
                          # Unauthorized: the real server must close without HELLO_ACK.
                          try:
                              data = connection.recv(24)
                          except ssl.SSLError:
                              data = b""
                          print(f"{label}: closed={time.monotonic()-sent:.2f}s total={time.monotonic()-started:.2f}s")
                          assert data == b"", f"unauthorized client received {data!r}"
          # Wrong key first: rejected before any session is created.
          tls_hello("wrong-key", "ffeeddccbbaa99887766554433221100", expect_ack=False)
          # Authorized key: the real per-install credential, completes pairing.
          tls_hello("authorized", os.environ["PHONE_KEY"], expect_ack=True)
          print("PASS external TLS 1.3 client, wrong-key rejection, pinned Android Keystore certificate, AMB1 response and quality command dispatch")
          PY_TLS
          wait "$instrument_pid"
          cat build/secure-wifi/instrumentation.log
          # The custom instrumentation writes a PASS marker via finish(stream)
          # but Android's am instrument -w does not necessarily print a final
          # INSTRUMENTATION_CODE line. Require the authenticated result itself.
          grep -q "PASS USB permission, encrypted client storage, EC signature fixtures, Android Keystore TLS 1.3, wrong-key rejection, host handshake, approval UI and live revocation" build/secure-wifi/instrumentation.log
          if grep -q '^FAIL:' build/secure-wifi/instrumentation.log; then
            echo "Instrumentation reported a failure" >&2
            exit 1
          fi
          # The camera acceptance clears app data, so preserve the
          # authorization UI captures from the first run before it does.
          timeout 30 adb pull /sdcard/Android/data/dev.nekomario.amb/files/authorization-ui build/secure-wifi/authorization-ui
          # Camera acceptance: same disposable emulator, fresh profile and the
          # real Camera2/MediaCodec producer. This is emulated-camera evidence
          # and never substitutes for the physical-device gate in issue #8.
          adb shell pm clear dev.nekomario.amb
          adb shell pm grant dev.nekomario.amb android.permission.CAMERA
          adb shell am instrument -w -e disposableUi true -e cameraAcceptance true \
            dev.nekomario.amb.test/dev.nekomario.amb.UsbPermissionInstrumentation \
            > build/secure-wifi/camera-acceptance.log 2>&1 || true
          cat build/secure-wifi/camera-acceptance.log
          # Missing marker is a failure, never a silent pass.
          grep -qE 'PASS camera acceptance|SKIP camera acceptance|FAIL:' build/secure-wifi/camera-acceptance.log
          if grep -q '^FAIL:' build/secure-wifi/camera-acceptance.log; then
            echo "Camera acceptance failed" >&2
            exit 1
          fi
          if grep -q 'SKIP camera acceptance' build/secure-wifi/camera-acceptance.log; then
            echo "camera acceptance SKIPPED on this emulator image (recorded; the physical gate stays open):"
            grep 'SKIP camera acceptance' build/secure-wifi/camera-acceptance.log
          fi
      - name: Verify collected authorization UI artifacts
        if: always()
        env:
          CONFORMANCE_OUTCOME: ${{ steps.conformance.outcome }}
        run: |
          set -euo pipefail
          if [ "$CONFORMANCE_OUTCOME" = success ]; then
            python3 - <<'PY_ARTIFACTS'
          import json, os, pathlib, re, struct
          root = pathlib.Path('build/secure-wifi')
          directory = root / 'authorization-ui'
          suffixes = ('reject-request', 'pending', 'stale-safe', 'allowed', 'reconnected', 'client-details', 'revoked')
          expected = {f'{lang}-{suffix}' for lang in ('en', 'ja') for suffix in suffixes} | {'storage-failed'}
          assert {p.stem for p in directory.glob('*.png')} == expected, 'missing or stale capture membership'
          assert {p.stem for p in directory.glob('*.json')} == expected, 'missing or stale capture metadata'
          for name in sorted(expected):
              data = (directory / f'{name}.png').read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n' and data[12:16] == b'IHDR', name
              width, height = struct.unpack('>II', data[16:24])
              meta = json.loads((directory / f'{name}.json').read_text())
              assert meta['scenario'] == name and (width, height) == (meta['width'], meta['height']) == (840, 1400), (name, meta)
              assert 0 < meta['widthDp'] <= 360, (name, meta)
              assert meta['locale'].split('-')[0] == ('ja' if name.startswith('ja-') else 'en'), (name, meta)
              assert abs(meta['fontScale'] - (1.0 if name.startswith('en-') else 1.3)) < .02, (name, meta)
          assert (root / 'source-head.txt').read_text().strip() == os.environ['GITHUB_SHA']
          receipts = (root / 'apk-sha256.txt').read_text().splitlines()
          assert len(receipts) == 2 and all(re.match(r'^[0-9a-f]{64}  .+\.apk$', line) for line in receipts)
          print(f'PASS {len(expected)} scenario PNG/metadata pairs and source/APK provenance; visual acceptance is separate')
          PY_ARTIFACTS
          fi
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secure-wifi-emulator-logs
          path: build/secure-wifi
          retention-days: 7
          if-no-files-found: warn
