name: mutants

# Full mutation testing runs weekly; relevant PRs only check the minimal test build.
# `--in-place` is required because the tests include `protocol/fixtures`
# by a path outside the crate directory.
on:
  pull_request:
    paths:
      - '.github/workflows/mutants.yml'
      - 'host-rs/src/preview.rs'
      - 'host-rs/src/preview/**'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Unit-test dev dependencies still include egui_kittest/eframe, even
      # when the runtime GUI/video features are disabled.
      - name: Native dependencies for host unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libusb-1.0-0-dev libx11-dev libxkbcommon-dev libwayland-dev
      - name: Check preview tests without runtime GUI/video dependencies
        if: github.event_name == 'pull_request'
        working-directory: host-rs
        run: "cargo test --no-default-features --lib preview::"
      - name: Install cargo-mutants
        if: github.event_name != 'pull_request'
        run: cargo install --locked cargo-mutants
      - name: Mutate the preview record against its own tests
        if: github.event_name != 'pull_request'
        working-directory: host-rs
        # Quoted: YAML reads a plain scalar ending in `::` as the start of a mapping.
        run: "cargo mutants --no-default-features --in-place --file src/preview.rs --timeout 25 -- --lib preview::"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report
          path: host-rs/mutants.out
