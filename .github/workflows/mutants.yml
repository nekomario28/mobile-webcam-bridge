name: mutants

# Weekly, not per pull request: a mutation run rebuilds and retests for every mutant,
# and the value is a trend rather than a gate on one change. `--in-place` is required
# because the tests include `protocol/fixtures` by a path outside the crate directory.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Unit-test dev dependencies still include egui_kittest/eframe, even
      # when the runtime GUI/video features are disabled.
      - name: Native dependencies for host unit tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libusb-1.0-0-dev libx11-dev libxkbcommon-dev libwayland-dev
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Mutate the preview record against its own tests
        working-directory: host-rs
        # Quoted: YAML reads a plain scalar ending in `::` as the start of a mapping.
        run: "cargo mutants --no-default-features --in-place --file src/preview.rs --timeout 25 -- --lib preview::"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: host-rs/mutants.out
