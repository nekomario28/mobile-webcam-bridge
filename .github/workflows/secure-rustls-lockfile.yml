name: secure-rustls-lockfile
on:
  push:
    branches: ['feature/secure-wifi-tls13-auth']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve patched rustls and emit canonical Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          rustup default stable
          cargo update --manifest-path host-rs/Cargo.toml -p rustls --precise 0.23.45
          echo RUSTLS_LOCKFILE_B64_BEGIN
          base64 -w0 host-rs/Cargo.lock
          echo
          echo RUSTLS_LOCKFILE_B64_END
