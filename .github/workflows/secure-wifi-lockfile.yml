name: secure-wifi-lockfile
on:
  push:
    branches: ['feature/secure-wifi-tls13-auth']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate dependency lockfile on a clean Linux runner
        run: |
          set -euo pipefail
          rustup default stable
          cargo generate-lockfile --manifest-path host-rs/Cargo.toml
          echo LOCKFILE_B64_BEGIN
          base64 -w0 host-rs/Cargo.lock
          echo
          echo LOCKFILE_B64_END
