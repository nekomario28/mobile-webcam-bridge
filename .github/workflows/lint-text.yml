name: lint-text

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  docs-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: relative links are the ones this repository owns. External URLs are
      # somebody else's uptime and would fail this gate for the wrong reason.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress '*.md' 'docs/**/*.md' 'specs/**/*.md'
          fail: true

  ffmpeg-source-offer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offer matches build_ffmpeg.py pins
        run: python3 host-rs/tools/check_ffmpeg_source_offer.py

