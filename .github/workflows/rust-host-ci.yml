name: rust-host-ci
on:
  push:
    branches: [main]
    paths: ['host-rs/**', 'linux/**', 'windows/**', '.github/workflows/rust-host-ci.yml']
  pull_request:
    branches: [main]
    paths: ['host-rs/**', 'linux/**', 'windows/**', '.github/workflows/rust-host-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-host-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '1'
  MOBILE_WEBCAM_REQUIRE_MINIMAL: '1'
jobs:
  linux:
    # Measured (job 120309340125, 2026-10-23): the dependency step alone took **17 min
    # 1 s** on this runner, and the job was canceled at the 30-minute limit while still
    # building. Twice in a row for the same reason. So: the gate and the release build
    # are separate jobs (each pays the apt + FFmpeg cost, but neither carries the other's
    # tail), and the budget is 45 minutes rather than 30 — the same correction the
    # windows job already needed, for the same reason, with the measurement written down.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native dependencies and pinned Rust
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config nasm python3 libclang-dev libva-dev libdrm-dev libusb-1.0-0-dev libx11-dev libxkbcommon-dev libwayland-dev fonts-noto-cjk
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      # fonts-noto-cjk: the GUI searches Noto Sans CJK JP / Yu Gothic / Meiryo for Japanese
      # labels, and egui_kittest panics on a character nothing can draw. Without a CJK font
      # the harness reported `No glyph for "\u6a5f" (U+6A5F)` on this runner while passing on a
      # desktop that has one (measured 2026-10-26, #107). The font belongs in the image; the
      # panic belongs in the harness.
      - name: Formatting, lints and the test suite
        run: |
          python3 host-rs/tools/build_ffmpeg.py linux --prefix "$PWD/host-rs/target/native-linux" --cache "$PWD/host-rs/target/ffmpeg-source"
          export FFMPEG_DIR="$PWD/host-rs/target/native-linux"
          export LD_LIBRARY_PATH="$FFMPEG_DIR/lib"
          export MOBILE_WEBCAM_REQUIRE_MINIMAL=1
          cargo fmt --manifest-path host-rs/Cargo.toml --check
          cargo clippy --manifest-path host-rs/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path host-rs/Cargo.toml --locked

  linux-release:
    # The release artifacts and the settings round-trip against the classic Qt app.
    # Separated so a slow apt mirror cannot cancel the gate above.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native dependencies and pinned Rust
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config nasm python3 libclang-dev libva-dev libdrm-dev libusb-1.0-0-dev libx11-dev libxkbcommon-dev libwayland-dev fonts-noto-cjk qt6-base-dev
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Release builds and the Qt settings round-trip
        run: |
          python3 host-rs/tools/build_ffmpeg.py linux --prefix "$PWD/host-rs/target/native-linux" --cache "$PWD/host-rs/target/ffmpeg-source"
          export FFMPEG_DIR="$PWD/host-rs/target/native-linux"
          export LD_LIBRARY_PATH="$FFMPEG_DIR/lib"
          export MOBILE_WEBCAM_REQUIRE_MINIMAL=1
          export CARGO_BUILD_JOBS=1
          cargo build --manifest-path host-rs/Cargo.toml --release --bin mobile-webcam --locked
          cargo build --manifest-path host-rs/Cargo.toml --release --no-default-features --bin mobile-webcam-usb --locked
          # pkg-config output must word-split into separate flags.
          # shellcheck disable=SC2046
          c++ -fPIC host-rs/tests/qt_settings.cpp $(pkg-config --cflags --libs Qt6Core) -o host-rs/target/qt-settings
          host-rs/target/qt-settings write host-rs/target/qt-fixture.conf
          cargo run --manifest-path host-rs/Cargo.toml --locked --example settings_fixture -- host-rs/target/qt-fixture.conf
          host-rs/target/qt-settings read host-rs/target/qt-fixture.conf

  pipewire-backend:
    # The PipeWire camera is an optional feature, so nothing else in CI compiles it.
    # Without this job it would rot silently between releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native dependencies and pinned Rust
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config nasm python3 libclang-dev libva-dev libdrm-dev libusb-1.0-0-dev libx11-dev libxkbcommon-dev libwayland-dev fonts-noto-cjk libpipewire-0.3-dev
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Build and test the PipeWire backend
        run: |
          set -euo pipefail
          # `libspa 0.10` needs SPA headers that define `spa_meta_sync_timeline`
          # (PipeWire >= 1.4). Ubuntu 24.04 ships 1.0.5, so the feature cannot even
          # compile here: say so out loud instead of either failing every run or
          # skipping in silence, and let the gate activate by itself on a newer image.
          have=$(pkg-config --modversion libpipewire-0.3)
          if [ "$(printf '%s\n1.4\n' "$have" | sort -V | head -1)" != "$have" ] || [ "$have" = "1.4" ]; then
            : # 1.4 or newer
          else
            echo "::warning::PipeWire $have is older than 1.4; the pipewire backend needs newer SPA headers, so this job skipped. Verified locally against PipeWire 1.6.9."
            exit 0
          fi
          python3 host-rs/tools/build_ffmpeg.py linux --prefix "$PWD/host-rs/target/native-linux" --cache "$PWD/host-rs/target/ffmpeg-source"
          export FFMPEG_DIR="$PWD/host-rs/target/native-linux"
          export LD_LIBRARY_PATH="$FFMPEG_DIR/lib"
          cargo clippy --manifest-path host-rs/Cargo.toml --all-targets --features pipewire --locked -- -D warnings
          cargo test --manifest-path host-rs/Cargo.toml --features pipewire --locked
          cargo build --manifest-path host-rs/Cargo.toml --features pipewire --locked --example pipewire_probe

  windows:
    runs-on: windows-2025
    # Time budget only; every check below is unchanged. d13face measured this
    # job on the TLS branch (FFmpeg 8m21s, clippy 5m29s, test build 14m15s,
    # release still pending) and the same job here was canceled at 30m22s
    # while still inside the FFmpeg step (run 38618355206, head 1c506d0), so
    # 30 minutes could never reach clippy/test/release/Qt verification.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The release job's windows half reads repository files as *data*: VERSION names the
      # installer (windows/package.cmake) and windows/unity-capture.sha256 goes to sha256sum.
      # A CRLF checkout appends a carriage return to each name, and that is exactly what kept
      # the windows release job red for four releases: `sha256sum: 'UnityCaptureFilter32.dll'
      # $'\r': No such file or directory` (2026-10-25, run 40208940608). .gitattributes keeps
      # text at LF, and this probe runs where a CRLF checkout would be produced, so removing
      # that rule fails here rather than three weeks later inside a release.
      - name: The release inputs survive a Windows checkout
        shell: bash
        run: |
          set -euo pipefail
          for file in VERSION windows/unity-capture.sha256; do
            if grep -q $'\r' "$file"; then
              echo "$file arrived with CRLF; .gitattributes must keep it at LF"
              exit 1
            fi
          done
          while read -r _hash name; do
            test -n "$name" || continue
            echo "checksum entry names $name"
          done < windows/unity-capture.sha256

      - name: Pinned Rust GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt,clippy
          rustup default 1.98.1-x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            make nasm python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-qt6-base
      - name: Minimal FFmpeg and native worker/settings checks
        shell: msys2 {0}
        run: |
          /usr/bin/python3 host-rs/tools/build_ffmpeg.py windows --cross-prefix='' --prefix "$PWD/host-rs/target/native-windows" --cache "$PWD/host-rs/target/ffmpeg-source"
          export FFMPEG_DIR="$(cygpath -am host-rs/target/native-windows)"
          export PATH="$PWD/host-rs/target/native-windows/bin:$PATH"
          export PKG_CONFIG_ALLOW_CROSS=1
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc
          export LIBCLANG_PATH="$(cygpath -am /mingw64/bin)"
          export CLANG_PATH="$(cygpath -am /mingw64/bin/clang.exe)"
          export BINDGEN_EXTRA_CLANG_ARGS='--target=x86_64-w64-windows-gnu'
          clang --version
          cargo fmt --manifest-path host-rs/Cargo.toml --check
          cargo clippy --manifest-path host-rs/Cargo.toml --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings
          cargo test --manifest-path host-rs/Cargo.toml --target x86_64-pc-windows-gnu --locked -- --test-threads=1
          cargo build --manifest-path host-rs/Cargo.toml --target x86_64-pc-windows-gnu --release --locked --bin mobile-webcam
          g++ host-rs/tests/qt_settings.cpp $(pkg-config --cflags --libs Qt6Core) -o host-rs/target/qt-settings.exe
          host-rs/target/qt-settings.exe write --native
          cargo run --manifest-path host-rs/Cargo.toml --target x86_64-pc-windows-gnu --locked --example settings_fixture
          host-rs/target/qt-settings.exe read --native
