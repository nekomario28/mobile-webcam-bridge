name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, mobile-webcam]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Verify release tag and checkout
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AMB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p build
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/release.keystore
          chmod 600 build/release.keystore

      - name: Build and verify signed Android APK
        shell: bash
        env:
          AMB_RELEASE_STORE_FILE: ${{ github.workspace }}/build/release.keystore
          AMB_RELEASE_STORE_PASSWORD: ${{ secrets.AMB_RELEASE_STORE_PASSWORD }}
          AMB_RELEASE_KEY_ALIAS: ${{ secrets.AMB_RELEASE_KEY_ALIAS }}
          AMB_RELEASE_KEY_PASSWORD: ${{ secrets.AMB_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AMB_RELEASE_STORE_PASSWORD"
          test -n "$AMB_RELEASE_KEY_ALIAS"
          test -n "$AMB_RELEASE_KEY_PASSWORD"
          cd android
          gradle --no-daemon --stacktrace clean assembleRelease lintRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$apk"

      - name: Build and test Linux AppImage
        shell: bash
        run: ./linux/build-appimage.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          apk="dist/Mobile_Webcam-$version-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          cd dist
          sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256"
          cat "Mobile_Webcam-$version-x86_64.AppImage.sha256" \
              "$(basename "$apk").sha256" > SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" \
            "dist/Mobile_Webcam-$version-x86_64.AppImage" \
            "dist/Mobile_Webcam-$version-android.apk" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Mobile Webcam $version" \
            --generate-notes
