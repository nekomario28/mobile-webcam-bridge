name: release

on:
  push:
    tags:
      # Classic Qt releases use VERSION; Rust releases use native-CI artifacts.
      - 'v0.1.*'
      - '!v*-beta.*'

# Read-only by default. contents: write is granted only on publish, the job
# that creates the GitHub Release. This workflow does not mint an OIDC token
# or publish build provenance.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, mobile-webcam]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Verify release tag and checkout
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
          # A release build must not read a cache a pull request could have written
          # and then sign the result; measured by zizmor as cache poisoning.
          cache-disabled: true

      - name: Restore Android release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AMB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p build
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/release.keystore
          chmod 600 build/release.keystore

      - name: Build and verify signed Android APK
        shell: bash
        env:
          AMB_RELEASE_STORE_FILE: ${{ github.workspace }}/build/release.keystore
          AMB_RELEASE_STORE_PASSWORD: ${{ secrets.AMB_RELEASE_STORE_PASSWORD }}
          AMB_RELEASE_KEY_ALIAS: ${{ secrets.AMB_RELEASE_KEY_ALIAS }}
          AMB_RELEASE_KEY_PASSWORD: ${{ secrets.AMB_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AMB_RELEASE_STORE_PASSWORD"
          test -n "$AMB_RELEASE_KEY_ALIAS"
          test -n "$AMB_RELEASE_KEY_PASSWORD"
          cd android
          gradle --no-daemon --stacktrace clean assembleRelease lintRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$apk"

      - name: Build and test Linux AppImage
        shell: bash
        run: ./linux/build-appimage.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          apk="dist/Mobile_Webcam-$version-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          cd dist
          sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256"
          cat "Mobile_Webcam-$version-x86_64.AppImage.sha256" \
              "$(basename "$apk").sha256" > SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          gh release create "$GITHUB_REF_NAME" \
            "dist/Mobile_Webcam-$version-x86_64.AppImage" \
            "dist/Mobile_Webcam-$version-android.apk" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Mobile Webcam $version" \
            --generate-notes

      # The self-hosted runner persists between jobs: never leave the signing
      # key on its disk after a release, successful or not.
      - name: Remove the release signing key from the runner
        if: always()
        shell: bash
        run: rm -f build/release.keystore
