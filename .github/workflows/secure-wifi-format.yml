name: secure-wifi-format
on:
  push:
    branches: ['feature/secure-wifi-tls13-auth']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Format Rust source on pinned toolchain and emit modified files
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          cargo fmt --manifest-path host-rs/Cargo.toml
          git diff --name-only -- 'host-rs/*.rs' 'host-rs/src/**' 'host-rs/tests/**' | while IFS= read -r path; do
            echo "FORMAT_START=$path"
            base64 -w0 "$path"
            echo
            echo "FORMAT_END=$path"
          done
