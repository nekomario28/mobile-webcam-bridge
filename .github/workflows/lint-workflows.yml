name: lint-workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'zizmor.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'zizmor.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The security-relevant properties actionlint does not look at: expression
      # injection, credential handling, over-broad permissions, unpinned actions,
      # and caches a pull request could poison before a privileged job reads them.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
