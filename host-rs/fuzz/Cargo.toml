[package]
name = "mobile-webcam-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
mobile-webcam = { path = "..", default-features = false, features = ["fuzzing"] }

# A fuzz crate in its own workspace: `cargo test` at the crate root must not try to
# build a libFuzzer binary.
[workspace]

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_stream"
path = "fuzz_targets/frame_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_lines"
path = "fuzz_targets/control_lines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_file"
path = "fuzz_targets/settings_file.rs"
test = false
doc = false
bench = false
