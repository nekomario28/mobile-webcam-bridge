<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Webcam — 画面案</title>
<style>
:root { color-scheme: light; font-family: system-ui, "Noto Sans CJK JP", sans-serif; color: #202a3b; background: #eef2f6; font-size: 16px; }
* { box-sizing: border-box; }
body { margin: 0; padding: 64px 20px; }
main { max-width: 480px; margin: auto; }
h1 { margin: 0; padding: 22px 24px 0; font-size: 18px; font-weight: 650; }
.app { border: 1px solid #dce2ea; border-radius: 12px; background: white; box-shadow: 0 8px 28px #263c5710; }
form { padding: 22px 24px 24px; }
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; background: white; border: 1px solid #cbd4e2; border-radius: 7px; padding: 10px 14px; }
button:hover { border-color: #8398b8; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #8bb5fa; outline-offset: 3px; }
button:disabled { opacity: .55; cursor: default; }
.mode { display: flex; gap: 4px; background: #f0f3f7; border-radius: 8px; padding: 4px; margin-bottom: 24px; }
.mode button { flex: 1; border: none; background: transparent; font-weight: 600; }
.mode button[aria-pressed="true"] { background: white; color: #2459aa; box-shadow: 0 1px 4px #1a365419; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
input[type="text"], select { width: 100%; color: inherit; background: white; border: 1px solid #cbd4e2; border-radius: 7px; padding: 11px 12px; min-width: 0; }
.endpoint { margin-bottom: 24px; }
#save-error { color: #a13939; font-size: 13px; margin: -12px 0 18px; }
.status { display: flex; gap: 10px; margin-bottom: 18px; font-size: 14px; }
.dot { margin-top: 6px; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #8392a9; }
.status[data-state="streaming"] .dot { background: #2a8661; }
.status[data-state="error"] .dot { background: #c54d4d; }
.status p { font-size: 13px; color: #596980; margin: 6px 0 0; }
#primary { width: 100%; background: #2b61b6; color: white; border-color: #2b61b6; font-weight: 650; padding: 12px; }
#primary[data-stop="true"] { color: #a13939; border-color: #dfb8b8; background: white; }
.settings { margin-top: 22px; border-top: 1px solid #edf0f4; padding-top: 16px; }
summary { cursor: pointer; font-size: 14px; color: #4b5d78; }
.fields { padding-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.check { display: flex; gap: 9px; align-items: center; font-weight: 400; margin: 0; }
.check input { width: 16px; height: 16px; accent-color: #2b61b6; }
.wide { grid-column: 1 / -1; }
#diagnostic { font-size: 13px; color: #596980; margin: 0; }
.preview { margin-top: 20px; padding: 0 4px; }
.preview > summary { font-size: 12px; color: #66758b; }
.preview .fields { padding-top: 16px; gap: 14px; }
.preview label, .preview select, .preview button { font-size: 13px; }
[hidden] { display: none !important; }
@media(max-width: 520px) { body { padding: 24px 16px; } h1 { padding: 20px 20px 0; } form { padding: 20px; } }
</style>
<main>
  <section class="app" aria-label="Mobile Webcam">
    <h1>Mobile Webcam</h1>
    <form id="connection-form">
      <div class="mode" aria-label="接続方法">
        <button type="button" id="usb-mode" aria-pressed="false">USB</button>
        <button type="button" id="wifi-mode" aria-pressed="true">Wi-Fi</button>
      </div>
      <div class="endpoint" id="wifi-field">
        <label for="address">IPアドレス</label>
        <input type="text" id="address" value="192.168.1.42" autocomplete="off" spellcheck="false" placeholder="192.168.1.42">
      </div>
      <div class="endpoint" id="usb-field" hidden>
        <label for="device">スマホ</label>
        <select id="device"><option>Xperia</option><option>Android accessory</option></select>
      </div>
      <p id="save-error" role="status" hidden>設定を保存できません</p>
      <div class="status" id="status" data-state="idle" role="status" aria-live="polite" hidden>
        <span class="dot" aria-hidden="true"></span>
        <div><span id="status-title"></span><p id="status-body" hidden></p></div>
      </div>
      <button type="submit" id="primary">接続</button>
      <details class="settings">
        <summary>詳細</summary>
        <div class="fields">
          <div><label for="rotation">回転</label><select id="rotation"><option>0°</option><option>90°</option><option>180°</option><option>270°</option></select></div>
          <div><label for="decode">デコード</label><select id="decode"><option>自動</option><option>ソフトウェア</option><option id="gpu-option">D3D11VA</option><option>CUDA</option></select></div>
          <label class="check"><input type="checkbox" checked>左右反転</label>
          <label class="check"><input type="checkbox">上下反転</label>
          <div class="wide" id="linux-output" hidden><label for="output">出力先</label><input type="text" id="output" value="/dev/video10"></div>
          <p class="wide" id="diagnostic" hidden></p>
        </div>
      </details>
    </form>
  </section>
  <details class="preview">
    <summary>画面案（通信なし）</summary>
    <div class="fields">
      <div><label for="platform">OS</label><select id="platform"><option>Windows</option><option>Linux</option></select></div>
      <div><label for="scene">状態</label><select id="scene"><option value="idle">接続前</option><option value="connecting">接続中</option><option value="waiting">開始待ち</option><option value="consumer">アプリ待ち</option><option value="streaming">送信中</option><option value="error">接続エラー</option></select></div>
      <button type="button" id="reset">IPをリセット</button>
    </div>
  </details>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
let mode = 'wifi', state = 'idle', pending = null, saveTimer = null;
const storageKey = 'mobile-webcam-rust-design.lanHost';
try { const value = localStorage.getItem(storageKey); if (value !== null) el('address').value = value; }
catch { el('save-error').hidden = false; }
function saveAddress() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(storageKey, el('address').value.trim()); el('save-error').hidden = true; }
  catch { el('save-error').hidden = false; }
}
function render(next) {
  state = next;
  const windows = el('platform').value === 'Windows';
  const info = {
    idle: ['', '', '接続'],
    connecting: [mode === 'wifi' ? '接続中…' : 'USBを準備中…', '', '取消'],
    waiting: ['スマホで「カメラ開始」を押してください', '', '停止'],
    consumer: ['アプリで「Mobile Webcam」を選択してください', '', '停止'],
    streaming: ['カメラへ送信中', '', '停止'],
    error: ['接続できません', mode === 'wifi' ? 'Wi-FiとIPを確認' : 'USB接続とスマホの許可を確認', '再接続']
  }[next];
  el('status').hidden = next === 'idle'; el('status').dataset.state = next;
  el('status-title').textContent = info[0]; el('status-body').textContent = info[1]; el('status-body').hidden = !info[1];
  el('primary').textContent = info[2]; el('primary').dataset.stop = !['idle', 'error'].includes(next);
  const active = !['idle', 'error'].includes(next);
  for (const id of ['usb-mode', 'wifi-mode', 'address', 'device']) el(id).disabled = active;
  el('diagnostic').hidden = !['streaming', 'consumer'].includes(next);
  el('diagnostic').textContent = next === 'streaming' ? '受信 30 fps · 送信 30 fps' : '受信 30 fps · 送信 0 fps';
  el('scene').value = next;
  el('gpu-option').textContent = windows ? 'D3D11VA' : 'VAAPI';
}
function chooseMode(next) {
  mode = next;
  el('wifi-field').hidden = next !== 'wifi'; el('usb-field').hidden = next !== 'usb';
  el('wifi-mode').setAttribute('aria-pressed', String(next === 'wifi'));
  el('usb-mode').setAttribute('aria-pressed', String(next === 'usb'));
  render('idle');
}
el('wifi-mode').onclick = () => chooseMode('wifi'); el('usb-mode').onclick = () => chooseMode('usb');
el('address').addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveAddress, 300); });
window.addEventListener('pagehide', saveAddress);
el('connection-form').addEventListener('submit', event => {
  event.preventDefault(); clearTimeout(pending); saveAddress();
  if (!['idle', 'error'].includes(state)) { render('idle'); return; }
  if (mode === 'wifi' && !el('address').value.trim()) {
    render('error'); el('status-title').textContent = 'IPアドレスを入力してください'; el('status-body').hidden = true;
    el('primary').textContent = '接続'; el('address').focus(); return;
  }
  render('connecting'); pending = setTimeout(() => render('waiting'), 900);
});
el('scene').onchange = () => { clearTimeout(pending); render(el('scene').value); };
el('platform').onchange = () => {
  clearTimeout(pending);
  const windows = el('platform').value === 'Windows';
  el('linux-output').hidden = windows;
  document.querySelector('#scene option[value="consumer"]').disabled = !windows;
  render('idle');
};
el('reset').onclick = () => { el('address').value = '192.168.1.42'; saveAddress(); };
</script>
</html>
